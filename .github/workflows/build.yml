name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    # Runs the real unit tests for parser/schema/db logic (both engines) on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install duckdb (optional engine)
        run: pip install duckdb
      - name: Run unit tests
        run: python -m unittest duckpad.tests.test_core -v

  build-windows-exe:
    # This is the step that produces the actual single .exe file. It runs on
    # a real Windows machine (GitHub's hosted runner) because PyInstaller
    # cannot cross-compile -- a Windows .exe can only be built on Windows.
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # needed to publish a Release; uses the auto-provided
                        # GITHUB_TOKEN below, not a personal token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller duckdb

      - name: Run unit tests on Windows too
        run: python -m unittest duckpad.tests.test_core -v

      - name: Build single-file exe
        run: >
          pyinstaller --onefile --windowed --name DuckPadLite
          --add-data "duckpad;duckpad"
          --hidden-import duckdb
          --hidden-import uuid
          --icon "assets\icon.ico"
          main.py

      - name: Smoke-test the built exe actually launches
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\DuckPadLite.exe" -PassThru
          Start-Sleep -Seconds 5
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            Write-Error "DuckPadLite.exe exited within 5 seconds of launch -- treating this as a build failure."
            exit 1
          }
          Write-Host "DuckPadLite.exe is running after 5 seconds (PID $($proc.Id)) -- looks healthy."
          Stop-Process -Id $proc.Id -Force

      - name: Build and run the frozen DuckDB regression test
        # 'Launches OK' doesn't mean 'works' -- this exact class of bug (frozen
        # duckdb needing uuid at runtime even though nothing imports it
        # directly) passed the launch check above just fine and only broke on
        # an actual import/query. This packages scripts/duckdb_smoke_test.py
        # with the same hidden-import flags as the real app and runs the full
        # import -> query -> schema -> cell-update flow frozen, gating the
        # release on it actually working, not just starting.
        run: >
          pyinstaller --onefile --name duckdb_smoke_test --paths .
          --hidden-import duckdb --hidden-import uuid
          scripts/duckdb_smoke_test.py

      - name: Run the frozen DuckDB regression test
        shell: pwsh
        run: |
          $output = & ".\dist\duckdb_smoke_test.exe" 2>&1
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or ($output -notmatch "DUCKDB_SMOKE_OK")) {
            Write-Error "Frozen DuckDB smoke test failed -- treating this as a build failure."
            exit 1
          }

      - name: Upload the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckPadLite-windows
          path: dist/DuckPadLite.exe
          retention-days: 30

      - name: Publish a GitHub Release with the exe attached
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: DuckPad Lite build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `DuckPadLite.exe` below -- no installer, no Python, no admin rights needed.
          files: dist/DuckPadLite.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
