[package]
name = "duckpad"
version = "0.1.0"
description = "The fastest path from tabular data to SQL."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" statically links DuckDB into the binary so the portable build
# ships as a single .exe with no external DuckDB DLL to carry alongside it.
duckdb = { version = "1", features = ["bundled"] }
once_cell = "1"
thiserror = "1"

[profile.release]
opt-level = "z"     # optimize for binary size — portability matters more than raw speed here
lto = true
codegen-units = 1
panic = "abort"
strip = true
